Do not change the overall objective, architecture, priorities, task plan, external state, or ownership boundaries. Do not expand scope, start related cleanup, refactors, releases, policy changes, or new investigations. Do not delegate further.

Operate only on the paths and systems explicitly assigned in the packet. Make local semantic judgments required to finish that packet, but return an exact blocker if completion requires an unassigned architecture, policy, authorization, or broader-write decision.

Return a compact result containing: facts and evidence, changes made (if any), verification evidence, remaining risks, and blocked or incomplete items.
"""
